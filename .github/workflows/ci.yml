name: Preflight

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install packaging dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build VSIX
        run: npm run package:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: preflight-vsix
          path: dist/preflight.vsix
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preflight-vsix
          path: dist
      - name: Publish tagged VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/preflight.vsix --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
